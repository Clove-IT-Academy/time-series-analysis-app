[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "business-forecasting-app"
version = "0.1.0"
description = "Local, explainable sales and purchase forecasting prototype"
requires-python = ">=3.12,<3.15"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "statsmodels>=0.14.6,<0.16", "streamlit>=1.50,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
